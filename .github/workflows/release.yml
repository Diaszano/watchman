name: Release and Docker

on:
  workflow_call:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release and GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot release tags
        shell: bash
        run: .github/scripts/resolve-release-tag.sh snapshot "$RUNNER_TEMP/release-tags-before.txt"

      - name: Create semantic release
        id: semantic-release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec semantic-release

      - name: Report semantic-release status
        if: steps.semantic-release.outcome == 'failure'
        run: |
          echo "::notice::semantic-release reported failure; verifying whether a release tag was created."

      - name: Resolve published version
        id: release
        shell: bash
        run: .github/scripts/resolve-release-tag.sh resolve "$RUNNER_TEMP/release-tags-before.txt" "$GITHUB_OUTPUT"

      - name: Verify release publication on semantic-release failure
        if: steps.semantic-release.outcome == 'failure' && steps.release.outputs.published != 'true'
        run: |
          echo "::error::semantic-release failed before a release tag could be published."
          exit 1

      - name: Build Docker tags
        id: docker-tags
        shell: bash
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_PUBLISHED: ${{ steps.release.outputs.published }}
          VERSION: ${{ steps.release.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          GHCR_IMAGE="${GHCR_IMAGE,,}"
          if [[ "$REF_NAME" == "main" ]]; then
            primary_tag="${GHCR_IMAGE}:latest"
          else
            primary_tag="${GHCR_IMAGE}:dev"
          fi
          if [[ "$RELEASE_PUBLISHED" == "true" ]]; then
            primary_image="${GHCR_IMAGE}:${VERSION}"
          else
            primary_image="${primary_tag}"
          fi
          echo "primary_image=${primary_image}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            if [[ "$REF_NAME" == "main" ]]; then
              echo "${GHCR_IMAGE}:latest"
              if [[ "$RELEASE_PUBLISHED" == "true" ]]; then
                major="${VERSION%%.*}"
                remainder="${VERSION#*.}"
                minor="${remainder%%.*}"
                echo "${GHCR_IMAGE}:${VERSION}"
                echo "${GHCR_IMAGE}:${major}.${minor}"
                echo "${GHCR_IMAGE}:${major}"
              fi
            else
              echo "${GHCR_IMAGE}:dev"
              if [[ "$RELEASE_PUBLISHED" == "true" ]]; then
                echo "${GHCR_IMAGE}:${VERSION}"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.docker-tags.outputs.primary_image }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM to release
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.release.outputs.version }}"
          gh release upload "$VERSION" sbom.spdx.json --clobber
